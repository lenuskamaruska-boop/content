<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Превью баннера — DIN-рейки -60% | ritet.net</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, "Helvetica Neue", sans-serif;
      background: #f4f5f7;
      color: #222;
    }
    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 16px 64px;
    }
    h1 { font-size: 20px; font-weight: 700; }
    p.note { color: #666; font-size: 14px; }

    /* --- баннер (та же разметка, что и для вставки на сайт) --- */
    .promo-banner {
      display: block;
      width: 100%;
      max-width: 100%;
      overflow: hidden;
    }
    .promo-banner img {
      display: block;
      width: 100%;
      height: auto;
    }
    /* по желанию: скругление + лёгкая тень для карточного вида */
    .promo-banner.rounded {
      border-radius: 12px;
      box-shadow: 0 6px 24px rgba(0,0,0,.08);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Превью промо-баннера</h1>
    <p class="note">Полная ширина контейнера (1200px). Уменьшайте окно браузера, чтобы проверить адаптивность.</p>

    <a href="/catalog/din-reyki/" class="promo-banner rounded" aria-label="Цены тают на DIN-рейки — скидки до -60%">
      <img
        src="din-reyki-sale-60.png"
        alt="Цены тают на DIN-рейки — скидки до -60%"
        width="1672"
        height="941"
        decoding="async"
      >
    </a>
  </div>
</body>
</html>
