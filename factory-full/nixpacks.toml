# Конфиг для Railway (Nixpacks)
# Устанавливает Chromium для Puppeteer (рендер каруселей в картинки)

[phases.setup]
nixPkgs = [
  "nodejs_20",
  "chromium",
  "nss",
  "nspr",
  "atk",
  "cups",
  "dbus",
  "expat",
  "libdrm",
  "libxkbcommon",
  "mesa",
  "pango",
  "cairo",
  "xorg.libX11",
  "xorg.libXcomposite",
  "xorg.libXdamage",
  "xorg.libXext",
  "xorg.libXfixes",
  "xorg.libXrandr",
  "xorg.libxcb",
  "xorg.libXcursor",
  "xorg.libXi",
  "xorg.libXrender",
  "xorg.libXtst",
  "xorg.libXScrnSaver",
  "alsa-lib",
  "at-spi2-atk",
  "at-spi2-core",
  "glib",
  "gtk3",
  "systemd",
]

[phases.install]
cmds = ["npm install --omit=dev"]

[start]
cmd = "npm start"
